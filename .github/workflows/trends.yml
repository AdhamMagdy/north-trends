name: update-trends
on:
  schedule:
    - cron: "0 */6 * * *"   # كل 6 ساعات
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "urllib3<2" pytrends pandas
      - run: python fetch_trends.py
      - run: |
          git config user.name "trends-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "update trends" || exit 0
          git push
